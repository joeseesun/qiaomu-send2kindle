description "Qiaomu Kindle wireless receiver"
start on started volumd
stop on (stopping volumd or ota-update)
respawn
respawn limit 3 60
pre-start exec /bin/sh /mnt/us/qiaomu-kindle/firewall.sh start
exec /bin/sh /mnt/us/qiaomu-kindle/serve.sh
post-stop exec /bin/sh /mnt/us/qiaomu-kindle/firewall.sh stop
