name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standalone:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: npm ci --prefix scripts/converter --ignore-scripts
      - run: npm run build --prefix scripts/converter
      - run: git diff --exit-code -- scripts/converter/converter.cjs scripts/converter/converter.cjs.LEGAL.txt
      - run: npm test --prefix scripts/converter
